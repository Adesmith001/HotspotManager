name: iPhone device test build

on:
  workflow_dispatch:
  push:
    branches: [codex/ios-device-build]

permissions:
  contents: read

jobs:
  iphone-ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: pod install
        working-directory: ios
      - name: Build for a physical iPhone
        run: |
          xcodebuild -workspace ios/HotspotManager.xcworkspace -scheme HotspotManager \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath ios/build CODE_SIGNING_ALLOWED=NO ARCHS=arm64 \
            PRODUCT_BUNDLE_IDENTIFIER=com.hotspotmanager.mobiletest build

          app=ios/build/Build/Products/Release-iphoneos/HotspotManager.app
          test -f "$app/HotspotManager"
          test -f "$app/main.jsbundle"
          xcrun vtool -show-build "$app/HotspotManager"
          mkdir -p ios/build/ipa/Payload
          ditto "$app" ios/build/ipa/Payload/HotspotManager.app
          (
            cd ios/build/ipa
            ditto -c -k --keepParent Payload HotspotManager-iPhone.ipa
          )
      - uses: actions/upload-artifact@v4
        with:
          name: HotspotManager-iPhone-IPA
          path: ios/build/ipa/HotspotManager-iPhone.ipa
          if-no-files-found: error
